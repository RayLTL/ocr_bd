<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OCR 工作台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <header>
        <div><h1>OCR 工作台</h1><p>上传图片，提取其中的中文与英文文本。</p></div>
        <span id="api-status" class="api-status" title="API 配置状态">&#9679; 检查中...</span>
      </header>
      <section class="workspace" aria-label="OCR recognition">
        <section class="service-picker" aria-label="OCR service selection">
          <label for="service-search">OCR 接口</label>
          <div class="service-control"><input id="service-search" type="search" autocomplete="off" placeholder="搜索接口：名称、分类或路径" /><div id="service-list" class="service-list" role="listbox" hidden></div></div>
          <p id="service-description" class="hint"></p>
        </section>
        <label class="dropzone" id="dropzone" for="file-input">
          <input id="file-input" type="file" accept="image/jpeg,image/png,image/webp,image/bmp" />
          <img id="preview" hidden alt="所选图片预览" />
          <div id="upload-copy"><strong>选择图片</strong><span>拖拽或点击上传，JPG、PNG、WebP 或 BMP，最大 5 MB</span></div>
        </label>
        <div class="actions"><button id="recognize" type="button" disabled>识别文字</button><span id="status" role="status">等待图片</span></div>
        <section class="result" aria-live="polite">
          <div class="result-heading">
            <h2>识别结果</h2>
            <div class="result-tools">
              <div class="segmented" role="group" aria-label="输出模式">
                <button id="layout-mode" type="button" class="active" disabled>按版式</button>
                <button id="plain-mode" type="button" disabled>逐行</button>
              </div>
              <button id="copy" type="button" disabled title="复制文本">复制</button>
              <button id="copy-latex" type="button" disabled title="复制 LaTeX 源码" hidden>复制 LaTeX</button>
              <button id="copy-mathml" type="button" disabled title="复制为 Word 可识别的公式" hidden>复制为公式</button>
              <button id="export-txt" type="button" disabled title="导出为 TXT">导出 TXT</button>
              <button id="export-xlsx" type="button" disabled title="导出为 Excel">导出 Excel</button>
            </div>
          </div>
          <pre id="result-text">识别后的文本会显示在这里。</pre>
        </section>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.19/dist/katex.min.js"></script>
  </body>
</html>
